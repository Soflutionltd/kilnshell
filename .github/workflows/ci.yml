name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm rebuild @vscode/ripgrep
      - run: npm run build
      - name: Benchmark against Desktop Commander (also a smoke test of every core tool)
        run: BENCH_RUNS=3 node bench/bench.mjs
