  <text x="343" y="392" font-size="12" font-weight="700" fill="#FF8A3D">1.4 ms  ·  13.7x</text>
  <text x="286" y="427" text-anchor="end" font-size="14" fill="#C9D1DC">Read 10 files at once</text>
  <rect x="300" y="408" width="480" height="15" rx="4" fill="#3A4354"/>
