  <text x="311.9270848284771" y="116" font-size="12" font-weight="700" fill="#FF8A3D">5.7 ms  ·  122.2x</text>
  <text x="286" y="151" text-anchor="end" font-size="14" fill="#C9D1DC">Run a command (git --version)</text>
  <rect x="300" y="132" width="480" height="15" rx="4" fill="#3A4354"/>
  <text x="788" y="144" font-size="12" fill="#8B95A7">703.7 ms</text>
  <rect x="300" y="150" width="11.050163421912746" height="15" rx="4" fill="#FF6A1A"/>
  <text x="319.05016342191277" y="162" font-size="12" font-weight="700" fill="#FF8A3D">16.2 ms  ·  43.4x</text>
  <text x="286" y="197" text-anchor="end" font-size="14" fill="#C9D1DC">Read 1,000 lines of a 20k-line file</text>
  <rect x="300" y="178" width="480" height="15" rx="4" fill="#3A4354"/>
