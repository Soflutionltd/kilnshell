  <text x="868" y="68" text-anchor="end" font-size="12" fill="#5B6577">darwin arm64, zsh login profile, 2026-10-26</text>
  <text x="286" y="105" text-anchor="end" font-size="14" fill="#C9D1DC">Run a command (echo)</text>
  <rect x="300" y="86" width="480" height="15" rx="4" fill="#3A4354"/>
  <text x="788" y="98" font-size="12" fill="#8B95A7">696.7 ms</text>
