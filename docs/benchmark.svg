  <text x="321.8328530259366" y="300" font-size="12" font-weight="700" fill="#FF8A3D">1 ms  ·  34.7x</text>
  <text x="286" y="335" text-anchor="end" font-size="14" fill="#C9D1DC">File info</text>
  <rect x="300" y="316" width="480" height="15" rx="4" fill="#3A4354"/>
  <text x="788" y="328" font-size="12" fill="#8B95A7">21.8 ms</text>
  <rect x="300" y="334" width="26.42201834862385" height="15" rx="4" fill="#FF6A1A"/>
  <text x="334.42201834862385" y="346" font-size="12" font-weight="700" fill="#FF8A3D">1.2 ms  ·  18.2x</text>
  <text x="286" y="381" text-anchor="end" font-size="14" fill="#C9D1DC">List a directory</text>
  <rect x="300" y="362" width="480" height="15" rx="4" fill="#3A4354"/>
  <text x="788" y="374" font-size="12" fill="#8B95A7">19.2 ms</text>
