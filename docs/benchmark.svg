  <rect x="300" y="224" width="480" height="15" rx="4" fill="#3A4354"/>
  <text x="788" y="236" font-size="12" fill="#8B95A7">75.7 ms</text>
  <rect x="300" y="242" width="43.751651254953764" height="15" rx="4" fill="#FF6A1A"/>
  <text x="351.75165125495374" y="254" font-size="12" font-weight="700" fill="#FF8A3D">6.9 ms  ·  11x</text>
  <text x="286" y="289" text-anchor="end" font-size="14" fill="#C9D1DC">Write a file</text>
  <rect x="300" y="270" width="480" height="15" rx="4" fill="#3A4354"/>
  <text x="788" y="282" font-size="12" fill="#8B95A7">34.7 ms</text>
