  <rect x="300" y="426" width="8.75912408759124" height="15" rx="4" fill="#FF6A1A"/>
  <text x="316.75912408759126" y="438" font-size="12" font-weight="700" fill="#FF8A3D">3.5 ms  ·  54.8x</text>
</svg>
